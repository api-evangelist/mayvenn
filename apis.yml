aid: mayvenn
name: Mayvenn
description: >-
  Mayvenn is an Oakland, California beauty-commerce company that sells quality virgin human hair
  extensions, sew-in weave bundles, closures, frontals, and human hair wigs directly to consumers and
  through a network of more than 100,000 hair stylists. Founded by Diishan Imira and backed by a16z and
  500 Global, Mayvenn pairs its hair products with a stylist-driven distribution model and a 30-day
  return policy, running its storefront on Shopify at shop.mayvenn.com. The company does not currently
  publish a public first-party developer API; this profile captures its web identity, security posture,
  and commercial link surface for the API Evangelist network.
